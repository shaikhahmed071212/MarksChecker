<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marks Checker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
}

.container{
    width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
    text-align:center;
}

h1{
    color:#2575fc;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:18px;
}

input:focus{
    border-color:#2575fc;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2575fc;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0b5ed7;
    transform:scale(1.03);
}

.result{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:#f4f4f4;
    display:none;
}

.result h2{
    color:#333;
    margin-bottom:10px;
}

.pass{
    color:green;
    font-weight:bold;
}

.fail{
    color:red;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>📚 Marks Checker</h1>

<input type="number" id="obtained" placeholder="Obtained Marks">

<input type="number" id="total" placeholder="Total Marks">

<button onclick="checkMarks()">
Check Result
</button>

<div class="result" id="result">

<h2>Your Result</h2>

<p><strong>Percentage:</strong>
<span id="percentage"></span>
</p>

<p><strong>Grade:</strong>
<span id="grade"></span>
</p>

<p><strong>Status:</strong>
<span id="status"></span>
</p>

</div>

</div>

<script>

function checkMarks(){

let obtained=Number(document.getElementById("obtained").value);
let total=Number(document.getElementById("total").value);

if(obtained=="" || total==""){
alert("Please enter marks.");
return;
}

if(obtained>total){
alert("Obtained marks cannot be greater than Total Marks.");
return;
}

let percentage=(obtained/total)*100;

let grade="";
let status="";

if(percentage>=90){
grade="A+";
status="Pass";
}
else if(percentage>=80){
grade="A";
status="Pass";
}
else if(percentage>=70){
grade="B";
status="Pass";
}
else if(percentage>=60){
grade="C";
status="Pass";
}
else if(percentage>=50){
grade="D";
status="Pass";
}
else{
grade="F";
status="Fail";
}

document.getElementById("percentage").innerHTML=percentage.toFixed(2)+" %";
document.getElementById("grade").innerHTML=grade;

let s=document.getElementById("status");

s.innerHTML=status;

if(status=="Pass"){
s.className="pass";
}
else{
s.className="fail";
}

document.getElementById("result").style.display="block";

}

</script>

</body>
</html>
